name: Dependency review

on:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, OFL-1.1, BlueOak-1.0.0
          allow-dependencies-licenses: pkg:npm/lightningcss, pkg:npm/caniuse-lite, pkg:npm/argparse, pkg:npm/axe-core, pkg:npm/@vercel/og
